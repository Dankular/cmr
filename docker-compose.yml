version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cmr-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cmr-transport
    volumes:
      - mongodb_data:/data/db
    networks:
      - cmr-network

  # Uncomment to run the app in Docker
  # app:
  #   build: .
  #   container_name: cmr-app
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     DATABASE_URI: mongodb://mongodb:27017/cmr-transport
  #     PAYLOAD_SECRET: ${PAYLOAD_SECRET}
  #     NEXT_PUBLIC_SERVER_URL: http://localhost:3000
  #   depends_on:
  #     - mongodb
  #   volumes:
  #     - ./public/media:/app/public/media
  #   networks:
  #     - cmr-network

volumes:
  mongodb_data:
    driver: local

networks:
  cmr-network:
    driver: bridge
